  - id: "crapi-bola-vehicle-location-positive"
    suite: "live"
    target: "http://localhost:8888"
    detector: "access_control_check"
    request:
      endpoint: "/identity/api/v2/vehicle/{vehicle_id}/location"
      method: "GET"
    setup:
      needs_auth: true
      needs_lab: "crapi"
      resource_owner: "user_b"
      cross_session_accessor: "user_a"
    expected_outcome: "CONFIRMED"
    expected_evidence_substring: "access_control:two_session_leak_confirmed"
    expected_limitation: false
    rationale: "OWASP crAPI vehicle location API allows User A to view User B vehicle coordinates across sessions without authorization (BOLA)."

  - id: "crapi-bola-vehicle-unauth-negative"
    suite: "live"

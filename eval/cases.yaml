    expected_outcome: "NOT_VULNERABLE"
    expected_evidence_substring: "no_secrets_found"
    expected_limitation: true
    rationale: "Known architectural limitation: Secret is encoded in base64 within JavaScript atob(...) wrapper. Detector scans raw HTTP text and does not execute client JavaScript or deobfuscate strings."

    expected_outcome: "NOT_VULNERABLE"
    expected_evidence_substring: "ENCODED_SAFE"
    expected_limitation: false
    rationale: "Synthetic response strictly HTML entity-encodes all control characters (&lt; &gt; &quot; &#39;), neutralizing executable context."

  - id: "limit-dom-based-reflection"
    suite: "live"
    target: "http://localhost:3000"
    detector: "reflected_input_check"
    request:
      endpoint: "/#/search?q=<test>"
      method: "GET"
    setup:
      needs_auth: false
      needs_lab: "juiceshop"
    expected_outcome: "NOT_VULNERABLE"
    expected_evidence_substring: "ABSENT"
    expected_limitation: true
    rationale: "Known architectural limitation: DOM-based XSS executed only by browser JS via location.hash. Server-side HTTP probe receives static index.html and cannot detect DOM sinks without headless browser runtime."


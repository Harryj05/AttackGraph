      needs_lab: "none"
    expected_outcome: "HYPOTHESIS"
    expected_evidence_substring: "POTENTIAL_EXECUTABLE_CONTEXT"
    expected_limitation: false
    rationale: "Synthetic response echoes canary into input attribute with unencoded quotes, which breaks out of value attribute."


# eval/cases.yaml
# AttackGraph AI - Evaluation Test Suite v2 (36 Cases)
# Ground truth rationales documented BEFORE suite execution.
#
# Structural Validation Rule for Secrets:
# Regex pattern matches produce state HYPOTHESIS by default.
# Only secrets whose internal structure can be decoded and verified offline
# (e.g., JWT header/payload base64url decode into valid JSON objects with 'alg' or 'typ')
# are promoted to CONFIRMED. Unvalidated regex matches (e.g. AWS access key ID format,
# database URLs, API key assignments) remain HYPOTHESIS until actively verified.

cases:
  # ============================================================================
  # Reflected Input Check (12 Cases: 7 Live, 3 Unit, 2 Limitations)
  # ============================================================================
  - id: "dvwa-reflected-xss-low"
    suite: "live"
    target: "http://localhost:8080"
    detector: "reflected_input_check"
    request:
      endpoint: "/vulnerabilities/xss_r/?name=test"
      method: "GET"
    setup:
      needs_auth: true
      needs_lab: "dvwa"
      security_level: "low"
    expected_outcome: "HYPOTHESIS"
    expected_evidence_substring: "POTENTIAL_EXECUTABLE_CONTEXT"
    expected_limitation: false
    rationale: "DVWA low security reflects unencoded HTML control characters (<, >, \", ') directly into response body, creating potential executable HTML context."

  - id: "dvwa-reflected-xss-medium"
    suite: "live"
    target: "http://localhost:8080"
    detector: "reflected_input_check"
    request:
      endpoint: "/vulnerabilities/xss_r/?name=test"
      method: "GET"
    setup:
      needs_auth: true
      needs_lab: "dvwa"
      security_level: "medium"
    expected_outcome: "HYPOTHESIS"
    expected_evidence_substring: "POTENTIAL_EXECUTABLE_CONTEXT"
    expected_limitation: false
    rationale: "DVWA medium only strips literal <script> tags; double and single quotes survive unencoded in HTML body, allowing attribute and event injection."

  - id: "dvwa-reflected-xss-impossible"
    suite: "live"
    target: "http://localhost:8080"
    detector: "reflected_input_check"
    request:
      endpoint: "/vulnerabilities/xss_r/?name=test"
      method: "GET"
    setup:
      needs_auth: true
      needs_lab: "dvwa"
      security_level: "impossible"
    expected_outcome: "NOT_VULNERABLE"
    expected_evidence_substring: "ENCODED_SAFE"
    expected_limitation: false
    rationale: "DVWA impossible encodes all HTML control characters via htmlspecialchars(ENT_QUOTES) and requires Anti-CSRF token."


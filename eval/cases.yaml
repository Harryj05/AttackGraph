    expected_outcome: "NOT_VULNERABLE"
    expected_evidence_substring: "no_secrets_found"
    expected_limitation: true
    rationale: "Known architectural limitation: High-entropy opaque random string without standard keyword prefix (AKIA, Bearer, etc.). Regex-based detector misses high-entropy random secrets without Shannon entropy analysis."

  - id: "limit-obfuscated-base64-secret"
    suite: "unit"
    target: "mock://synthetic-obfuscated"
    detector: "secret_detection"

    expected_outcome: "NOT_VULNERABLE"
    expected_evidence_substring: "ABSENT"
    expected_limitation: true
    rationale: "Known architectural limitation: Detector only injects and tests GET query parameters; body reflections in POST JSON APIs are outside current detector scope."

  # ============================================================================
  # Access Control Check (12 Cases: 6 Live, 3 Unit, 3 Limitations)

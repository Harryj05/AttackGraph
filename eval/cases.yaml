    setup:
      needs_auth: true
      needs_lab: "crapi"
      resource_owner: "user_b"
      cross_session_accessor: "unauthorized"
    expected_outcome: "NOT_VULNERABLE"
    expected_evidence_substring: "access_control:two_session_enforced"
    expected_limitation: false
    rationale: "Accessing vehicle location without authorization token or with invalid session returns HTTP 401 Unauthorized."


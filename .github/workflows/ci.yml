name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8 (Fatal & Syntax Errors)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint with flake8 (Complexity & Style Warnings)
        run: |
          # Exit-zero reports formatting and style complexity warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  test:
    name: Unit & Mocked Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & mocked test suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          ATTACKGRAPH_API_KEY: "attackgraph-insecure-dev-key"
          X_API_KEY: "attackgraph-insecure-dev-key"
          CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
        run: |
          # Runs all 146 unit & mocked tests; live-lab container tests auto-skip when targets are offline
          python -m pytest -v

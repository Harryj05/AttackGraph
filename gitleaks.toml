title = "AttackGraph AI Audit Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for unit test fixtures, evaluation harness, documentation, and lab artifacts"
paths = [
    '''tests/test_secret_detection\.py''',
    '''tests/test_access_control_check\.py''',
    '''eval/cases\.yaml''',
    '''eval/results/.*''',
    '''eval/run\.py''',
    '''docker-compose\.crapi\.yml''',
    '''scripts/setup_crapi_users\.py''',
    '''README\.md'''
]

[[rules]]
id = "crapi-vehicle-uuid"
description = "crAPI vulnerable vehicle seed UUID in API paths"
regex = '''(?i)(?:vehicle(?:_id)?|identity/api/v2/vehicle)/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
